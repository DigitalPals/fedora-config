---
- name: Enable the selected Hyprland COPR only
  ansible.builtin.command: dnf -y copr enable sdegler/hyprland
  args:
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:sdegler:hyprland.repo
  when: not ansible_check_mode

- name: Install stable Hyprland and desktop integration packages
  ansible.builtin.dnf:
    name:
      - gdm
      - gnome-keyring
      - hyprland
      - hyprpicker
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-hyprland
      - desktop-file-utils
      - satty
      - nwg-look
      - grim
      - slurp
      - wf-recorder
      - wl-clipboard
      - wtype
      - brightnessctl
      - playerctl
      - socat
      # Shared helpers used by update/install scripts and link diagnostics.
      - curl
      - iw
      - tesseract
      - tesseract-langpack-eng
      - hunspell-nl
      - libnotify
      - libinput-utils
      - vulkan-loader
      - vulkan-tools
    state: present
  when: not ansible_check_mode

- name: Install the native Noctalia shell
  ansible.builtin.dnf:
    name:
      - noctalia
      - upower
    state: present
  when: not ansible_check_mode
  tags: [noctalia]

- name: Ensure GDM is the display manager while preserving GNOME
  ansible.builtin.systemd_service:
    name: gdm.service
    enabled: true

- name: Stop and disable the retired Quickshell desktop services
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - "--machine={{ primary_user }}@.host"
      - disable
      - --now
      - quickshell.service
      - hypridle.service
      - hyprpolkitagent.service
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  tags: [noctalia]

- name: Remove packages superseded by the native Noctalia shell
  ansible.builtin.dnf:
    name:
      - quickshell
      - hypridle
      - hyprlock
      - hyprpolkitagent
      - hyprsunset
      - fuzzel
      - matugen
      # Development headers used only by the retired QML lint/build path.
      - qt6-qtwebsockets-devel
      - qt6-qtdeclarative-devel
    state: absent
  when: not ansible_check_mode
  tags: [noctalia]

- name: Install Hyprland Noctalia session launcher
  ansible.builtin.template:
    src: hyprland-noctalia.j2
    dest: /usr/local/bin/hyprland-noctalia
    owner: root
    group: root
    mode: "0755"
  tags: [noctalia]

- name: Register Hyprland Noctalia GDM session
  ansible.builtin.copy:
    dest: /usr/share/wayland-sessions/hyprland-noctalia.desktop
    owner: root
    group: root
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=Hyprland (Noctalia)
      Comment=Hyprland with the Noctalia desktop shell
      Exec=/usr/local/bin/hyprland-noctalia
      TryExec=/usr/local/bin/hyprland-noctalia
      Type=Application
      DesktopNames=Hyprland
  tags: [noctalia]

- name: Remove retired Quickshell sessions, configuration, state, and units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/hyprland-quickshell
    - /usr/share/wayland-sessions/hyprland-quickshell.desktop
    - "{{ primary_home }}/.config/quickshell"
    - "{{ primary_home }}/.local/state/quickshell"
    - "{{ primary_home }}/.cache/quickshell"
    - "{{ primary_home }}/.config/systemd/user/quickshell.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/quickshell.service"
    - "{{ primary_home }}/.config/systemd/user/hypridle.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/hypridle.service"
    - "{{ primary_home }}/.config/systemd/user/hyprpolkitagent.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/hyprpolkitagent.service"
    - "{{ primary_home }}/.config/hypr/hypridle.conf"
    - "{{ primary_home }}/.config/hypr/hyprlock.conf"
  notify: Reload user systemd
  tags: [noctalia]

- name: Retire Lumen entirely
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/hyprland-lumen
    - /usr/share/wayland-sessions/hyprland-lumen.desktop
    - /usr/local/libexec/xps-lumen-compat-build
    - /usr/local/libexec/xps-lumen-launch
    - /opt/xps-builds/lumen-compat
    - "{{ primary_home }}/.config/systemd/user/lumen.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/lumen.service"
    - "{{ primary_home }}/.config/lumen"
  notify: Reload user systemd

- name: Remove the Lumen package
  ansible.builtin.dnf:
    name: lumen
    state: absent
  when: not ansible_check_mode

- name: Stop and disable retired Walker and Elephant user services
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - "--machine={{ primary_user }}@.host"
      - disable
      - --now
      - walker.service
      - elephant.service
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Remove retired Walker and Elephant user configuration and state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ primary_home }}/.config/systemd/user/walker.service"
    - "{{ primary_home }}/.config/systemd/user/elephant.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/walker.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/elephant.service"
    - "{{ primary_home }}/.config/walker"
    - "{{ primary_home }}/.config/elephant"
    - "{{ primary_home }}/.cache/walker"
    - "{{ primary_home }}/.cache/elephant"
    - "{{ primary_home }}/.local/state/walker"
    - "{{ primary_home }}/.local/state/elephant"
    - "{{ primary_home }}/.local/share/walker"
    - "{{ primary_home }}/.local/share/elephant"
  notify: Reload user systemd

- name: Create desktop configuration directories
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ primary_home }}/.config/hypr"
    - "{{ primary_home }}/.config/noctalia"
    - "{{ primary_home }}/.config/xdg-desktop-portal"
    - "{{ primary_home }}/.config/systemd/user"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants"
    - "{{ primary_home }}/.local/state/hyprland"
    - "{{ primary_home }}/.local/state/noctalia"
  tags: [noctalia]

- name: Install Hyprland Lua configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ primary_home }}/.config/hypr/{{ item }}"
    mode: "0644"
  loop:
    - hyprland.lua
    - monitors.lua
    - input.lua
    - looknfeel.lua
    - bindings.lua
    - autostart.lua
  tags: [noctalia]

- name: Mark the managed Noctalia setup as complete
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    content: ""
    dest: "{{ primary_home }}/.local/state/noctalia/.setup-complete"
    mode: "0644"
    force: false
  tags: [noctalia]

- name: Validate the managed Noctalia configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/noctalia
      - config
      - validate
      - "{{ role_path }}/files/noctalia/config.toml"
  environment:
    HOME: "{{ primary_home }}"
  changed_when: false
  when: not ansible_check_mode
  tags: [noctalia]

- name: Install Noctalia configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: noctalia/
    dest: "{{ primary_home }}/.config/noctalia/"
    mode: "0644"
    directory_mode: "0755"
  register: noctalia_config
  tags: [noctalia]

- name: Report that Noctalia will hot-reload the new configuration
  ansible.builtin.debug:
    msg: >-
      Noctalia configuration changed; a running shell will reload it. Its log
      is at `~/.cache/noctalia/noctalia.log`.
  when: noctalia_config is changed
  tags: [noctalia]

- name: Configure portal preference without patching Fedora files
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/xdg-desktop-portal/hyprland-portals.conf"
    mode: "0644"
    content: |
      [preferred]
      default=hyprland;gtk
      org.freedesktop.impl.portal.FileChooser=gtk
      org.freedesktop.impl.portal.Secret=gnome-keyring

- name: Install Hyprland graphical-session target
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/systemd/user/hyprland-session.target"
    mode: "0644"
    content: |
      [Unit]
      Description=Hyprland graphical session
      BindsTo=graphical-session.target
      Wants=graphical-session-pre.target
      After=graphical-session-pre.target
      Before=graphical-session.target

- name: Install restartable desktop user units
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "{{ primary_home }}/.config/systemd/user/{{ item }}.service"
    mode: "0644"
  loop:
    - voxtype
  notify: Reload user systemd

- name: Install external monitor watcher unit
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/systemd/user/external-monitor-toggle.service"
    mode: "0644"
    content: |
      [Unit]
      Description=Apply XPS lid and external display policy
      PartOf=hyprland-session.target

      [Service]
      Type=simple
      ExecStart=%h/.local/bin/external-monitor-toggle
      Restart=on-failure
      RestartSec=2

      [Install]
      WantedBy=hyprland-session.target

- name: Enable desktop units for the Hyprland target
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    src: "../{{ item }}.service"
    dest: "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/{{ item }}.service"
    state: link
    force: true
  loop:
    - voxtype
    - external-monitor-toggle
  notify: Reload user systemd

- name: Check whether Noctalia is already running
  ansible.builtin.command:
    argv:
      - pgrep
      - -u
      - "{{ ansible_facts.getent_passwd[primary_user][1] }}"
      - -x
      - noctalia
  register: noctalia_running
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [noctalia]

- name: Start Noctalia through an already-running Hyprland session
  ansible.builtin.command:
    argv:
      - systemd-run
      - --user
      - "--machine={{ primary_user }}@.host"
      - --unit=noctalia-transition
      - --wait
      - --collect
      - --property=Type=exec
      - /usr/bin/hyprctl
      - dispatch
      - 'hl.dsp.exec_cmd("/usr/bin/noctalia")'
  changed_when: false
  failed_when: false
  when:
    - not ansible_check_mode
    - noctalia_running.rc != 0
  tags: [noctalia]

- name: Preserve SELinux labels on local session executable
  ansible.builtin.command: restorecon -F /usr/local/bin/hyprland-noctalia
  changed_when: false
  when: not ansible_check_mode
  tags: [noctalia]
