---
- name: Enable the selected Hyprland COPR only
  ansible.builtin.command: dnf -y copr enable sdegler/hyprland
  args:
    creates: /etc/yum.repos.d/_copr:copr.fedorainfracloud.org:sdegler:hyprland.repo
  when: not ansible_check_mode

- name: Install stable Hyprland and desktop integration packages
  ansible.builtin.dnf:
    name:
      - gdm
      - gnome-keyring
      - hyprland
      - hypridle
      - hyprlock
      - hyprpicker
      - hyprpolkitagent
      - hyprsunset
      - quickshell
      - ImageMagick
      - xdg-desktop-portal
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-hyprland
      - desktop-file-utils
      # T3 Code Nightly claims its t3code:// OAuth callback on Linux with
      # xdg-mime when the packaged client starts. That generated handler runs
      # the AppImage directly, so it also needs the legacy FUSE 2 library even
      # though our ordinary launcher can fall back to extract-and-run.
      - xdg-utils
      - fuse-libs
      - satty
      - nwg-look
      - grim
      - slurp
      - wf-recorder
      - wl-clipboard
      - wtype
      - brightnessctl
      - playerctl
      - socat
      # Runtime dependencies of the Quickshell bar that were only ever
      # installed transitively: curl fetches the weather, iw reads the Wi-Fi
      # link rate.
      - curl
      - iw
      - tesseract
      - tesseract-langpack-eng
      - hunspell-nl
      - libnotify
      - libinput-utils
      - vulkan-loader
      - vulkan-tools
      # QtWebSockets QML module for the T3 Code bar client; Fedora ships
      # the QML plugin in the -devel subpackage.
      - qt6-qtwebsockets-devel
      # qmllint for the quickshell QML smoke check (tests/qml-lint).
      - qt6-qtdeclarative-devel
    state: present
  when: not ansible_check_mode

- name: Install Fedora fuzzel and matugen rather than COPR variants
  ansible.builtin.dnf:
    name:
      - fuzzel
      - matugen
    state: present
    disablerepo:
      - _copr:copr.fedorainfracloud.org:sdegler:hyprland
  when: not ansible_check_mode

- name: Ensure GDM is the display manager while preserving GNOME
  ansible.builtin.systemd_service:
    name: gdm.service
    enabled: true

- name: Install Hyprland Quickshell session launcher
  ansible.builtin.template:
    src: hyprland-quickshell.j2
    dest: /usr/local/bin/hyprland-quickshell
    owner: root
    group: root
    mode: "0755"

- name: Register Hyprland Quickshell GDM session
  ansible.builtin.copy:
    dest: /usr/share/wayland-sessions/hyprland-quickshell.desktop
    owner: root
    group: root
    mode: "0644"
    content: |
      [Desktop Entry]
      Name=Hyprland (Quickshell)
      Comment=Hyprland with Quickshell Desktop Shell
      Exec=/usr/local/bin/hyprland-quickshell
      TryExec=/usr/local/bin/hyprland-quickshell
      Type=Application
      DesktopNames=Hyprland

- name: Retire Lumen entirely
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/bin/hyprland-lumen
    - /usr/share/wayland-sessions/hyprland-lumen.desktop
    - /usr/local/libexec/xps-lumen-compat-build
    - /usr/local/libexec/xps-lumen-launch
    - /opt/xps-builds/lumen-compat
    - "{{ primary_home }}/.config/systemd/user/lumen.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/lumen.service"
    - "{{ primary_home }}/.config/lumen"
  notify: Reload user systemd

- name: Remove the Lumen package
  ansible.builtin.dnf:
    name: lumen
    state: absent
  when: not ansible_check_mode

- name: Stop and disable retired Walker and Elephant user services
  ansible.builtin.command:
    argv:
      - systemctl
      - --user
      - "--machine={{ primary_user }}@.host"
      - disable
      - --now
      - walker.service
      - elephant.service
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Remove retired Walker and Elephant user configuration and state
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ primary_home }}/.config/systemd/user/walker.service"
    - "{{ primary_home }}/.config/systemd/user/elephant.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/walker.service"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/elephant.service"
    - "{{ primary_home }}/.config/walker"
    - "{{ primary_home }}/.config/elephant"
    - "{{ primary_home }}/.cache/walker"
    - "{{ primary_home }}/.cache/elephant"
    - "{{ primary_home }}/.local/state/walker"
    - "{{ primary_home }}/.local/state/elephant"
    - "{{ primary_home }}/.local/share/walker"
    - "{{ primary_home }}/.local/share/elephant"
  notify: Reload user systemd

- name: Create desktop configuration directories
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ primary_home }}/.config/hypr"
    - "{{ primary_home }}/.config/xdg-desktop-portal"
    - "{{ primary_home }}/.config/systemd/user"
    - "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants"
    - "{{ primary_home }}/.local/state/hyprland"
  tags: [browser]

- name: Install Hyprland Lua configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ primary_home }}/.config/hypr/{{ item }}"
    mode: "0644"
  loop:
    - hyprland.lua
    - monitors.lua
    - input.lua
    - looknfeel.lua
    - bindings.lua
    - autostart.lua
  tags: [browser]

- name: Install rendered Hyprland helper configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ primary_home }}/.config/hypr/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: hypridle.conf.j2, dest: hypridle.conf }
    - { src: hyprlock.conf.j2, dest: hyprlock.conf }

# The copy below is unconditional, so broken QML would land on disk and only
# surface at the next shell reload, far from the change that caused it. Run
# the same static check tests/run uses, against the source tree, first.
# Skip with --skip-tags quickshell-lint; it is read-only, so it also runs
# under --check. tests/qml-lint exits 0 with a SKIP when qmllint is absent.
- name: Check the Quickshell configuration before installing it
  ansible.builtin.command: "{{ playbook_dir }}/tests/qml-lint"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  register: quickshell_lint
  tags: [quickshell, quickshell-lint]

# Reported separately so the findings themselves reach the terminal: a failing
# command module puts them in stdout, which the compact callback drops in
# favor of "non-zero return code".
- name: Refuse to install a Quickshell configuration that qmllint rejects
  ansible.builtin.fail:
    msg: "{{ quickshell_lint.stdout | default(quickshell_lint.stderr) | default('qmllint failed') }}"
  when: quickshell_lint.rc | default(0) != 0
  tags: [quickshell, quickshell-lint]

- name: Install Quickshell menubar configuration
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: quickshell/
    dest: "{{ primary_home }}/.config/quickshell/"
    mode: "0644"
    directory_mode: "0755"
  register: quickshell_config
  tags: [quickshell]

# Deliberately no restart handler: Quickshell watches its config directory and
# hot-reloads, and a forced restart mid-session is more disruptive than the
# problem it would solve.
- name: Report that the shell will hot-reload the new configuration
  ansible.builtin.debug:
    msg: >-
      Quickshell configuration changed; the running shell reloads it on its
      own. Check `journalctl --user -u quickshell.service -n 50` if the bar
      looks wrong.
  when: quickshell_config is changed
  tags: [quickshell]

- name: Remove retired Quickshell components
  ansible.builtin.file:
    path: "{{ primary_home }}/.config/quickshell/{{ item }}"
    state: absent
  loop:
    - Common/Popovers.qml
    - Popovers/LauncherPopover.qml
    - Popovers/PopoverWindow.qml
    # The unit tests moved to the repo's tests/quickshell/; this clears the
    # copies earlier deploys left behind. Safe to drop once every machine has
    # run the playbook since.
    - Common/tests
    # The switch and slider merged into Common/Toggle.qml and
    # Common/HSlider.qml. A directory carrying a qmldir is not scanned, so a
    # leftover copy is inert rather than ambiguous — this is tidiness.
    - Popovers/Toggle.qml
    - Popovers/HSlider.qml
    - Settings/SettingsSwitch.qml
    - Settings/SettingsSlider.qml
    - Bar/RecordingChip.qml
    - PowerMenu.qml
  tags: [quickshell]

- name: Configure portal preference without patching Fedora files
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/xdg-desktop-portal/hyprland-portals.conf"
    mode: "0644"
    content: |
      [preferred]
      default=hyprland;gtk
      org.freedesktop.impl.portal.FileChooser=gtk
      org.freedesktop.impl.portal.Secret=gnome-keyring

- name: Install Hyprland graphical-session target
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/systemd/user/hyprland-session.target"
    mode: "0644"
    content: |
      [Unit]
      Description=Hyprland graphical session
      BindsTo=graphical-session.target
      Wants=graphical-session-pre.target
      After=graphical-session-pre.target
      Before=graphical-session.target

- name: Install restartable desktop user units
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "{{ primary_home }}/.config/systemd/user/{{ item }}.service"
    mode: "0644"
  loop:
    - quickshell
    - hypridle
    - hyprpolkitagent
    - voxtype
  notify: Reload user systemd

- name: Install external monitor watcher unit
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    dest: "{{ primary_home }}/.config/systemd/user/external-monitor-toggle.service"
    mode: "0644"
    content: |
      [Unit]
      Description=Apply XPS lid and external display policy
      PartOf=hyprland-session.target

      [Service]
      Type=simple
      ExecStart=%h/.local/bin/external-monitor-toggle
      Restart=on-failure
      RestartSec=2

      [Install]
      WantedBy=hyprland-session.target

- name: Enable desktop units for the Hyprland target
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    src: "../{{ item }}.service"
    dest: "{{ primary_home }}/.config/systemd/user/hyprland-session.target.wants/{{ item }}.service"
    state: link
    force: true
  loop:
    - quickshell
    - hypridle
    - hyprpolkitagent
    - voxtype
    - external-monitor-toggle
  notify: Reload user systemd

- name: Preserve SELinux labels on local session executable
  ansible.builtin.command: restorecon -F /usr/local/bin/hyprland-quickshell
  changed_when: false
  when: not ansible_check_mode
