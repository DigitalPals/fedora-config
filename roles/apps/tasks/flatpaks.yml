---
- name: Read configured system Flatpak remotes
  ansible.builtin.command: flatpak remotes --system --columns=name
  register: apps_flatpak_remotes
  changed_when: false
  check_mode: false

- name: Add full Flathub remote
  ansible.builtin.command: >-
    flatpak remote-add --if-not-exists --system flathub
    https://flathub.org/repo/flathub.flatpakrepo
  changed_when: true
  when:
    - not ansible_check_mode
    - "'flathub' not in apps_flatpak_remotes.stdout_lines"

- name: Read installed system Flatpaks
  ansible.builtin.command: flatpak list --system --app --columns=application
  register: apps_flatpak_installed
  changed_when: false
  check_mode: false

# Updates of installed Flatpaks are the ./update wrapper's job; this only
# installs applications that are missing entirely.
- name: Install missing system Flatpaks
  ansible.builtin.command: >-
    flatpak install --system --noninteractive flathub {{ item }}
  changed_when: true
  loop: "{{ apps_flatpaks | difference(apps_flatpak_installed.stdout_lines) }}"
  when: not ansible_check_mode
