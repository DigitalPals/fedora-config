---
- name: Install Android SDK update helper
  ansible.builtin.template:
    src: android-sdk-update.j2
    dest: /usr/local/libexec/xps-android-sdk-update
    owner: root
    group: root
    mode: "0755"

- name: Install or update command-line Android SDK
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command: /usr/local/libexec/xps-android-sdk-update
  register: apps_android_update
  changed_when: (apps_android_update.stdout | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  when: not ansible_check_mode

- name: Report Android SDK update failure while retaining installed tools
  ansible.builtin.debug:
    msg: "Android SDK update failed; installed SDK retained: {{ apps_android_update.stderr | default('unknown failure') }}"
  when:
    - not ansible_check_mode
    - apps_android_update.rc | default(0) != 0
