---
- name: Reload XPS 2026 systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload XPS 2026 user systemd
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  failed_when: false

- name: Reload XPS 2026 udev rules
  ansible.builtin.command: udevadm control --reload
  changed_when: true

- name: Restart XPS 2026 haptic touchpad
  ansible.builtin.systemd_service:
    name: xps-haptic-touchpad.service
    state: restarted
  when: not ansible_check_mode

- name: Restart XPS 2026 speaker tuning
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    name: xps-speaker-tuning.service
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  failed_when: false
  when: not ansible_check_mode

- name: Restart XPS 2026 camera
  ansible.builtin.systemd_service:
    name: xps-ipu7-camera.service
    state: restarted
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_ready | default(false) | bool

- name: Restart XPS 2026 WirePlumber
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    name: wireplumber.service
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  failed_when: false
  when:
    - not ansible_check_mode
    - xps_2026_camera_ready | default(false) | bool

- name: Refresh WirePlumber after camera removal
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    name: wireplumber.service
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  failed_when: false
  when: not ansible_check_mode
