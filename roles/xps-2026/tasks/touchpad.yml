---
- name: Validate the configured haptic intensity
  ansible.builtin.assert:
    that:
      - xps_2026_haptic_intensity in ['low', 'mid', 'high']
    fail_msg: >-
      xps_2026_haptic_intensity must be low, mid, or high; got
      {{ xps_2026_haptic_intensity }}.
  tags: [xps-2026, hardware, touchpad]

- name: Install the XPS 2026 haptic touchpad daemon
  ansible.builtin.copy:
    src: xps-haptic-touchpad
    dest: /usr/local/libexec/xps-haptic-touchpad
    owner: root
    group: root
    mode: "0755"
  notify: Restart XPS 2026 haptic touchpad
  tags: [xps-2026, hardware, touchpad]

- name: Configure the XPS 2026 haptic intensity
  ansible.builtin.template:
    src: xps-haptic-touchpad.conf.j2
    dest: /etc/xps-haptic-touchpad.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart XPS 2026 haptic touchpad
  tags: [xps-2026, hardware, touchpad]

- name: Keep the XPS touchpad controller awake
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/80-xps-haptic-touchpad.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      # The Synaptics haptic engine stores its feature state in volatile RAM.
      # These Fedora power controls are intentionally retained in addition to
      # reapplying the reports after reset/re-enumeration.
      ACTION=="add", SUBSYSTEM=="pci", KERNEL=="0000:00:19.0", ATTR{power/control}="on"
      ACTION=="add", SUBSYSTEM=="platform", KERNEL=="i2c_designware.0", ATTR{power/control}="on"
      ACTION=="add|change", SUBSYSTEM=="i2c", KERNEL=="i2c-VEN_06CB:*", ATTR{power/control}="on"
  notify:
    - Reload XPS 2026 udev rules
    - Restart XPS 2026 haptic touchpad
  tags: [xps-2026, hardware, touchpad]

- name: Install the XPS 2026 haptic touchpad service
  ansible.builtin.template:
    src: xps-haptic-touchpad.service.j2
    dest: /etc/systemd/system/xps-haptic-touchpad.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload XPS 2026 systemd
    - Restart XPS 2026 haptic touchpad
  tags: [xps-2026, hardware, touchpad]

- name: Restore SELinux labels on the haptic touchpad files
  ansible.builtin.command:
    argv: [restorecon, -F, /usr/local/libexec/xps-haptic-touchpad, /etc/xps-haptic-touchpad.conf]
  changed_when: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, touchpad]

- name: Enable the XPS 2026 haptic touchpad service
  ansible.builtin.systemd_service:
    name: xps-haptic-touchpad.service
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
  tags: [xps-2026, hardware, touchpad]
