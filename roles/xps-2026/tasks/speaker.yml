---
- name: Create the managed XPS 2026 audio profile directory
  ansible.builtin.file:
    path: /usr/local/share/xps-2026/audio
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [xps-2026, hardware, speaker]

- name: Install the XPS 2026 13-biquad speaker profile
  ansible.builtin.copy:
    src: xps-speaker-filter-chain.conf
    dest: /usr/local/share/xps-2026/audio/filter-chain.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart XPS 2026 speaker tuning
  tags: [xps-2026, hardware, speaker]

- name: Install the isolated XPS 2026 PipeWire host configuration
  ansible.builtin.copy:
    src: xps-speaker-host.conf
    dest: /usr/local/share/xps-2026/audio/host.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart XPS 2026 speaker tuning
  tags: [xps-2026, hardware, speaker]

- name: Install the XPS 2026 speaker tuning manager
  ansible.builtin.copy:
    src: xps-speaker-tuning
    dest: /usr/local/libexec/xps-speaker-tuning
    owner: root
    group: root
    mode: "0755"
  notify: Restart XPS 2026 speaker tuning
  tags: [xps-2026, hardware, speaker]

- name: Create user systemd configuration for speaker tuning
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ primary_home }}/.config/systemd/user"
    - "{{ primary_home }}/.config/systemd/user/graphical-session.target.wants"
  tags: [xps-2026, hardware, speaker]

- name: Install the XPS 2026 speaker tuning user service
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.template:
    src: xps-speaker-tuning.service.j2
    dest: "{{ primary_home }}/.config/systemd/user/xps-speaker-tuning.service"
    mode: "0644"
  notify:
    - Reload XPS 2026 user systemd
    - Restart XPS 2026 speaker tuning
  tags: [xps-2026, hardware, speaker]

- name: Enable the XPS 2026 speaker tuning for graphical sessions
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.file:
    src: ../xps-speaker-tuning.service
    dest: "{{ primary_home }}/.config/systemd/user/graphical-session.target.wants/xps-speaker-tuning.service"
    state: link
    force: true
  notify:
    - Reload XPS 2026 user systemd
    - Restart XPS 2026 speaker tuning
  tags: [xps-2026, hardware, speaker]

- name: Restore SELinux labels on the speaker tuning files
  ansible.builtin.command:
    argv:
      - restorecon
      - -RF
      - /usr/local/libexec/xps-speaker-tuning
      - /usr/local/share/xps-2026/audio
      - "{{ primary_home }}/.config/systemd/user/xps-speaker-tuning.service"
  changed_when: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, speaker]

- name: Start the XPS 2026 speaker tuning in the current user session
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.systemd_service:
    name: xps-speaker-tuning.service
    state: started
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  register: xps_2026_speaker_start
  failed_when: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, speaker]

- name: Report a deferred speaker graph start
  ansible.builtin.debug:
    msg: >-
      The speaker service is installed and enabled but could not start in the
      current session. It will retry at graphical login; run
      'systemctl --user status xps-speaker-tuning' for diagnostics.
  when:
    - not ansible_check_mode
    - xps_2026_speaker_start is failed
  tags: [xps-2026, hardware, speaker]
