---
- name: Inspect every installed kernel command line for the OLED backlight quirk
  ansible.builtin.command:
    argv: [grubby, --info=ALL]
  register: xps_2026_backlight_boot_entries
  changed_when: false
  check_mode: false
  tags: [xps-2026, hardware, backlight]

- name: Enable VESA DPCD backlight probing for the XPS OLED panel
  ansible.builtin.command:
    argv:
      - grubby
      - --update-kernel=ALL
      - --remove-args=i915.enable_dpcd_backlight
      - --args=xe.enable_dpcd_backlight=1
  when: >-
    (xps_2026_backlight_boot_entries.stdout_lines
       | select('match', '^args=') | list | length == 0)
    or
    (xps_2026_backlight_boot_entries.stdout_lines
       | select('match', '^args=')
       | reject('search', '(^|[ "])xe[.]enable_dpcd_backlight=1([ "]|$)')
       | list | length > 0)
    or
    (xps_2026_backlight_boot_entries.stdout_lines
       | select('match', '^args=')
       | select('search', '(^|[ "])i915[.]enable_dpcd_backlight([= "]|$)')
       | list | length > 0)
  changed_when: true
  tags: [xps-2026, hardware, backlight]

- name: Verify every installed kernel entry has the XPS OLED backlight quirk
  ansible.builtin.command:
    argv: [grubby, --info=ALL]
  register: xps_2026_backlight_updated_entries
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
  tags: [xps-2026, hardware, backlight]

- name: Refuse an incomplete XPS OLED boot-entry update
  ansible.builtin.assert:
    that:
      - >-
        xps_2026_backlight_updated_entries.stdout_lines
          | select('match', '^args=') | list | length > 0
      - >-
        xps_2026_backlight_updated_entries.stdout_lines
          | select('match', '^args=')
          | reject('search', '(^|[ "])xe[.]enable_dpcd_backlight=1([ "]|$)')
          | list | length == 0
      - >-
        xps_2026_backlight_updated_entries.stdout_lines
          | select('match', '^args=')
          | select('search', '(^|[ "])i915[.]enable_dpcd_backlight([= "]|$)')
          | list | length == 0
    fail_msg: >-
      The XPS OLED needs xe.enable_dpcd_backlight=1 in every installed kernel
      entry; the misleading i915 variant must not remain configured.
    quiet: true
  when: not ansible_check_mode
  tags: [xps-2026, hardware, backlight]
