---
- name: Install explicit Panther Lake firmware, media, and regulatory packages
  ansible.builtin.dnf:
    name:
      - alsa-sof-firmware
      - linux-firmware
      - cirrus-audio-firmware
      - intel-audio-firmware
      - intel-gpu-firmware
      # Fedora owns and updates intel/ipu/ipu7ptl_fw.bin through this package.
      - intel-vsc-firmware
      - iwlwifi-mld-firmware
      - libva-intel-media-driver
      - libvpl
      - intel-vpl-gpu-rt
      - wireless-regdb
      - pipewire
      - pipewire-utils
      - pipewire-module-filter-chain-lv2
      - pulseaudio-utils
      - lsp-plugins-lv2
    state: present
  when: not ansible_check_mode
  tags: [xps-2026, hardware, packages]
