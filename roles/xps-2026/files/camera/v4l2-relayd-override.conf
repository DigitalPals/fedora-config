[Unit]
Requires=xps-ipu7-camera-init.service
After=xps-ipu7-camera-init.service
PartOf=xps-ipu7-camera.service
ConditionPathExists=/dev/video50

[Service]
Environment=GST_PLUGIN_PATH=/usr/lib64/gstreamer-1.0
# Fedora's relay unit intentionally sandboxes ordinary webcams. Intel's HAL
# needs the IPU/CVS devices and configuration paths, so relax only this instance.
PrivateNetwork=no
InaccessibleDirectories=
ReadOnlyDirectories=
DevicePolicy=auto
ExecStartPost=-/usr/local/libexec/xps-ipu7-refresh-wireplumber
