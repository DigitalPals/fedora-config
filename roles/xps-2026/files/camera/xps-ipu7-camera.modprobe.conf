# The Panther Lake camera sensor must probe after CVS acquires the USBIO power
# path. An explicit modprobe by xps-ipu7-camera-init bypasses this alias block.
blacklist ov08x40
softdep ov08x40 pre: intel_cvs

# Fedora/RPM Fusion's signed akmod supplies v4l2loopback. Keep this endpoint
# deterministic and exclusive-capable for browsers/PipeWire.
options v4l2loopback video_nr=50 card_label="Hardware ISP Camera" exclusive_caps=1 max_buffers=16
