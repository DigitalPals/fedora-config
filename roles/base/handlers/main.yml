---
- name: Reload firewalld
  ansible.builtin.systemd_service:
    name: firewalld.service
    state: reloaded

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart TuneD PPD bridge
  ansible.builtin.systemd_service:
    name: tuned-ppd.service
    state: restarted
