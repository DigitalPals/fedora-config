# Dell XPS laptop performance profile.
#
# Keep Intel HWP in its dynamically scaling governor while expressing a strong
# performance preference to the CPU and Dell firmware. In particular, do not
# inherit the server-oriented throughput-performance profile or pin
# min_perf_pct to 100.

[main]
summary=Dynamic performance profile for the Dell XPS
include=balanced

[cpu]
governor=powersave
energy_perf_bias=performance
energy_performance_preference=performance
boost=1

[acpi]
platform_profile=performance
