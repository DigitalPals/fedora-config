---
- name: Restart external monitor watcher after helper updates
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv: [systemctl, --user, try-restart, external-monitor-toggle.service]
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  changed_when: true
  failed_when: false
  when: not ansible_check_mode

- name: Restart Voxtype after configuration updates
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv: [systemctl, --user, try-restart, voxtype.service]
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[primary_user][1] }}"
  changed_when: true
  failed_when: false
  when: not ansible_check_mode
