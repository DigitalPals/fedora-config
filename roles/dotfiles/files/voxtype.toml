state_file = "auto"

[hotkey]
enabled = false

# Quickshell already exposes recording/transcription state in the managed
# menubar; do not probe for Voxtype's separate optional OSD frontend.
[osd]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "base"
language = "auto"
translate = false

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1
driver_order = ["wtype", "clipboard"]

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false
