---
- name: Fedora 44 parity for the Dell XPS
  hosts: xps
  gather_facts: true
  become: true
  pre_tasks:
    - name: Validate the feature contract
      ansible.builtin.assert:
        that:
          - features[item] is defined
          - features[item] is boolean
        fail_msg: "features.{{ item }} must be an explicit boolean in inventory/group_vars/all.yml"
      loop:
        - tailscale
        - docker
        - podman
        - steam
        - private_hooks
        - apple_display
        - source_builds
        - local_network_services
      tags: [always]

    - name: Validate feature dependencies
      ansible.builtin.assert:
        that:
          - not features.source_builds | bool or features.podman | bool
          - not features.apple_display | bool or features.private_hooks | bool
        fail_msg: >-
          source_builds requires podman, and apple_display requires
          private_hooks; make the inventory feature state internally consistent.
      tags: [always]

    - name: Validate explicit security trade-offs
      ansible.builtin.assert:
        that:
          - allow_insecure_sccache_transport is boolean
          - start_optional_hardware_services is boolean
        fail_msg: >-
          allow_insecure_sccache_transport and start_optional_hardware_services
          must be explicit booleans; insecure transport and immediate hardware
          activation are never inferred.
      tags: [always]

    - name: Refuse unsupported operating systems
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Fedora'
          - ansible_facts.distribution_major_version == fedora_release
          - ansible_facts.architecture == 'x86_64'
        fail_msg: >-
          This playbook targets Fedora {{ fedora_release }} x86_64 only; found
          {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }}
          {{ ansible_facts.architecture }}.
      tags: [always]

    - name: Verify target user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ primary_user }}"
      tags: [always]

    - name: Refuse a non-XPS hardware target
      ansible.builtin.assert:
        that:
          - ansible_facts.system_vendor == expected_hardware.sys_vendor
          - ansible_facts.product_name is regex(expected_hardware.product_name_regex)
          - ansible_facts.processor | join(' ') is regex(expected_hardware.cpu_regex)
        fail_msg: >-
          Hardware does not match the configured Dell XPS contract:
          {{ ansible_facts.system_vendor }} {{ ansible_facts.product_name }}.
      tags: [always]

  roles:
    - { role: base, tags: [base] }
    - { role: desktop, tags: [desktop] }
    - { role: apps, tags: [apps] }
    # Runs after apps because the camera uses Fedora's RPM Fusion akmod and
    # v4l2-relayd packages; all hardware actions remain precisely DMI-gated.
    - { role: xps-2026, tags: [xps-2026, hardware] }
    - { role: dotfiles, tags: [dotfiles] }
    # The role also removes its managed privileges/artifacts when disabled.
    - { role: private-hooks, tags: [private-hooks] }
    - { role: boot, tags: [boot] }
    - { role: finalize, tags: [finalize] }
