name: Fedora VM convergence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  fedora-44-vm:
    name: Fedora 44 desktop roles, two passes
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # actions/checkout v4.4.0, pinned for reviewable supply-chain changes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install VM test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cloud-image-utils qemu-system-x86 qemu-utils
          if test -e /dev/kvm; then sudo chmod a+rw /dev/kvm; fi

      - name: Converge the Fedora desktop twice
        run: ./tests/fedora-vm-convergence
