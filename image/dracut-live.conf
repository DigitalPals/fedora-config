# Generic live initramfs. Do not force legacy IDE/FireWire modules that were
# removed from modern kernels (livecd-tools 31 still names them).
filesystems+=" vfat isofs ext4 xfs btrfs squashfs "
# Include early kernel modesetting for the generic live image. Let the kernel
# select the matching GPU driver; do not force a vendor or blacklist Nouveau.
add_dracutmodules+=" livenet dmsquash-live pollcdrom drm "
hostonly="no"
dracut_rescue_image="no"
